name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Unit tests only. Integration tests (if any) need Docker and are run separately.
      - name: Test
        run: dotnet test tests/OracleSqlParser.Tests --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/OracleSqlParser --configuration Release --no-build --output ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
