name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Unit tests; the Oracle integration tests run in the 'integration' job.
      - name: Test
        run: |
          dotnet test tests/OracleSqlParser.Tests --configuration Release --no-build
          dotnet test tests/OracleSqlParser.Guard.Tests --configuration Release --no-build
      - name: Pack
        run: |
          dotnet pack src/OracleSqlParser --configuration Release --no-build --output ./artifacts
          dotnet pack src/OracleSqlParser.Guard --configuration Release --no-build --output ./artifacts
          dotnet pack src/OracleSqlParser.Cli --configuration Release --no-build --output ./artifacts
      - name: Native AOT smoke test (after pack, so it cannot affect the packed build)
        run: |
          dotnet publish tests/OracleSqlParser.AotSmoke --configuration Release --output ./aot-smoke
          ./aot-smoke/OracleSqlParser.AotSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # Parser and generator output executed against a real Oracle 23 Free container (gvenzl/oracle-free via Testcontainers).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORACLE_TESTS_REQUIRED: 'true'
      ORACLE_TEST_STARTUP_TIMEOUT_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pull Oracle image
        run: docker pull gvenzl/oracle-free:23-slim-faststart
      - name: Integration tests
        run: dotnet test tests/OracleSqlParser.IntegrationTests --configuration Release --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=minimal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: tests/OracleSqlParser.IntegrationTests/TestResults/*.trx

  publish:
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate tag matches csproj versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for csproj in src/OracleSqlParser/OracleSqlParser.csproj src/OracleSqlParser.Guard/OracleSqlParser.Guard.csproj src/OracleSqlParser.Cli/OracleSqlParser.Cli.csproj; do
            csproj_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$csproj" | head -n1)
            if [ -z "$csproj_version" ]; then
              echo "::error::Could not find <Version> in $csproj"
              status=1
            elif [ "$csproj_version" != "$tag_version" ]; then
              echo "::error::Tag '$GITHUB_REF_NAME' (version '$tag_version') does not match <Version> '$csproj_version' in $csproj. Bump the csproj or retag."
              status=1
            fi
          done
          exit $status
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ./artifacts
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: aklein53
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
